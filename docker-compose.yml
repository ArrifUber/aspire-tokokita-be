services:
  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "9000:9000" # S3 API Port
      - "9001:9001" # Web Console UI Port
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin1234
    command: server --console-address ":9001" /data

  db:
    image: postgres:16
    container_name: be-db
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: hackathon_be_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: hackathon-redis
    ports:
      - "6379:6379"


volumes:
  postgres_data:
  minio_data:
